<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Offline — TaskVerse</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <style>
        :root {
            --bg-primary: #0a071b;
            --bg-card: rgba(26, 16, 60, 0.7);
            --border-glass: rgba(168, 85, 247, 0.25);
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }

        .offline-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 28px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
        }

        .offline-icon-box {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c084fc;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.25);
        }

        .offline-icon-box svg {
            width: 38px;
            height: 38px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 24px;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 28px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .status-dot.online {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 48px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(124, 58, 237, 0.45);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .app-brand {
            margin-top: 24px;
            font-size: 0.82rem;
            color: #64748b;
        }

        .app-brand span {
            color: #a855f7;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <main class="offline-card" role="main">
        <div class="offline-icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>You're Currently Offline</h1>
        <p>TaskVerse requires an active connection to securely authenticate your session and sync your encrypted tasks, notes, and productivity points with the cloud database.</p>

        <div class="security-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">No Internet Connection</span>
        </div>

        <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Check Connection & Retry</span>
        </button>

        <div class="app-brand">
            <span>TaskVerse</span> &bull; Secure Productivity Workspace
        </div>
    </main>

    <script>
        function updateOnlineStatus() {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            if (navigator.onLine) {
                dot.classList.add('online');
                text.textContent = 'Connection Restored! Reconnecting...';
                setTimeout(function() {
                    window.location.href = './index.html';
                }, 800);
            } else {
                dot.classList.remove('online');
                text.textContent = 'No Internet Connection';
            }
        }

        function retryConnection() {
            var btn = document.getElementById('retryBtn');
            btn.style.opacity = '0.7';
            btn.innerHTML = 'Checking...';
            if (navigator.onLine) {
                window.location.href = './index.html';
            } else {
                setTimeout(function() {
                    btn.style.opacity = '1';
                    btn.innerHTML = '<span>Check Connection & Retry</span>';
                    updateOnlineStatus();
                }, 600);
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    </script>
</body>
</html>
